# push 到 main 时自动构建并推送到 GitHub Container Registry (ghcr.io)
# 使用原生 docker 命令，避免 actions 市场下载被 429 限流。

name: Publish Docker images (Sealos)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image owner (lowercase)
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push API image
        run: |
          IMAGE="${REGISTRY}/${OWNER_LC}/adaptlink-api"
          docker build -f apps/api/Dockerfile -t "${IMAGE}:latest" -t "${IMAGE}:${{ github.sha }}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image owner (lowercase)
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Resolve NEXT_PUBLIC_API_BASE_URL
        run: |
          if [ -n "${{ vars.NEXT_PUBLIC_API_BASE_URL }}" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8080/api/v1" >> "$GITHUB_ENV"
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push Web image
        run: |
          IMAGE="${REGISTRY}/${OWNER_LC}/adaptlink-web"
          docker build -f apps/web/Dockerfile \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}" \
            -t "${IMAGE}:latest" -t "${IMAGE}:${{ github.sha }}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
